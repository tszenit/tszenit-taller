*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1e2433;--soft:#5b6275;--line:#dfe4ee;--grid:#e6eaf4;--c:#0f7a6c;--cl:#eef7f5}
html{background:#f6f7fb}
body{font-family:Lora,Georgia,serif;color:var(--ink);font-size:15.2px;line-height:1.6;
 background-color:#fbfbfd;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hoja{max-width:820px;margin:0 auto;padding:40px 44px 70px}
.bar{display:flex;justify-content:flex-end;gap:10px;max-width:820px;margin:0 auto;padding:10px 44px 0}
.bar button{font:600 13px Lora;border:1.5px solid #c9cfdc;background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.mono{font-family:Mono,monospace;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;color:var(--soft)}
.chor{font-family:Chorus,'Lora',serif;font-weight:normal}
h1.tit{font-family:Chorus;font-weight:normal;font-size:58px;line-height:1.05;margin:6px 0 18px}
h1.tit mark{background:linear-gradient(transparent 58%,#f9e39a 58%,#f9e39a 90%,transparent 90%);color:inherit;padding:0 2px}
.uso{border:1.5px dashed #b9c1d3;border-radius:12px;background:#fff;padding:14px 18px;margin-bottom:26px}
.uso h4{font-family:Chorus;font-weight:normal;font-size:19px;margin-bottom:2px}
.toc{columns:2;column-gap:36px;margin-bottom:10px}
.toc .u{break-inside:avoid;margin-bottom:16px}
.toc h3{font-family:Chorus;font-weight:normal;font-size:23px;margin-bottom:4px}
.toc li{list-style:none;display:flex;gap:12px;font-size:14.3px;line-height:1.55}
.toc li span{font-family:Mono;font-size:11px;color:#8a90a0;min-width:34px;padding-top:3px}
.unidad{break-before:page;padding-top:26px}
.unidad>.mono{color:var(--c)}
.unidad>h2{font-family:Chorus;font-weight:normal;font-size:46px;line-height:1.08;margin:2px 0 2px}
.unidad>.preg{font-family:Lora;font-style:italic;color:var(--c);font-size:17px;margin-bottom:18px}
.lema{border:1.5px dashed var(--c);background:var(--cl);border-radius:12px;padding:12px 18px;text-align:center;font-family:Mono;font-size:14.5px;margin-bottom:18px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px 14px;margin-bottom:18px;box-shadow:0 1px 0 rgba(20,30,60,.03)}
.sec>h3{display:flex;align-items:baseline;gap:12px;font-family:Chorus;font-weight:normal;font-size:30px;line-height:1.15;margin-bottom:8px}
.sec>h3,.hh{break-after:avoid}.sec>h3 .n{font-family:Mono;font-size:13px;color:var(--c);font-weight:bold;letter-spacing:.05em}
.sec p{margin:6px 0}
.sec b{font-weight:650}
.hh{font-family:Chorus;font-size:21px;color:var(--c);margin:14px 0 4px;line-height:1.2}
.grid{display:grid;gap:12px;margin:10px 0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.card{border:1.5px solid var(--c);border-radius:12px;padding:10px 14px;background:#fff;break-inside:avoid}
.card.soft{border-color:var(--line)}
.card h5{font-family:Chorus;font-weight:normal;font-size:20px;color:var(--c);line-height:1.15;margin-bottom:3px}
.card .k{font-family:Mono;font-size:10.5px;letter-spacing:.12em;color:var(--soft);text-transform:uppercase;margin-bottom:4px}
.card p{margin:3px 0;font-size:14.5px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.8px;break-inside:avoid}
th{font-family:Chorus;font-weight:normal;font-size:17px;color:var(--c);text-align:left;padding:4px 8px;border-bottom:2.5px solid var(--c)}
td{padding:7px 8px;border-bottom:1px dashed #d6dbe6;vertical-align:top}
td:first-child{font-weight:600}
.fx{border:1.5px dashed #aeb6c8;border-radius:10px;padding:10px 16px;margin:10px 0;font-family:Mono;font-size:14px;line-height:1.7;background:#fcfcfe;text-align:center;break-inside:avoid}
.fx.l{text-align:left}
.box{border-radius:12px;padding:10px 16px;margin:12px 0;break-inside:avoid}
.box .t{font-family:Chorus;font-size:19px;margin-right:8px}
.trampa{border:1.5px solid #d6354e;background:#fff4f5}.trampa .t{color:#c8102e}
.regla{border:1.5px solid var(--c);background:var(--cl)}.regla .t{color:var(--c)}
.ej{border:1.5px solid #c9cfdc;border-radius:12px;padding:12px 16px;margin:12px 0;background:#fff;break-inside:avoid}
.ej .t{font-family:Chorus;font-size:20px;color:var(--c)}
.ej ol{margin:6px 0 4px 22px}.ej li{margin:3px 0}
.r{font-family:Chorus;color:var(--c);font-size:17.5px;letter-spacing:.01em}
.ans{font-family:Chorus;color:var(--c);font-size:17px;line-height:1.45}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.qa .card p:first-child{padding-bottom:6px;border-bottom:1px dashed #d6dbe6;margin-bottom:6px}
ul.l,ol.l{margin:6px 0 6px 22px}ul.l li,ol.l li{margin:3px 0}
.hl{background:linear-gradient(transparent 55%,var(--cl) 55%);padding:0 2px}
.tach{text-decoration:line-through;text-decoration-color:#e0a800;text-decoration-thickness:2px}
.fig{display:flex;justify-content:center;margin:10px 0;break-inside:avoid}
.fig svg{max-width:100%;height:auto}
.fig figcaption{font-family:Chorus;color:var(--soft);font-size:16px;text-align:center}
.aprendi{border-top:2px dotted var(--c);margin-top:16px;padding-top:6px;break-inside:avoid}
.aprendi .row{display:flex;justify-content:space-between;align-items:center}
.aprendi .row b{font-family:Chorus;font-weight:normal;font-size:19px;color:var(--c)}
.aprendi .row span{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:6px}
.aprendi .row i{display:inline-block;width:13px;height:13px;border:1.6px solid var(--c);border-radius:3px}
.aprendi .ln{height:32px;border-bottom:1px solid var(--c);opacity:.45}
sub,sup{font-size:.72em;line-height:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 2px}
.frac>span:first-child{border-bottom:1.2px solid currentColor;padding:0 3px}
.cuad .lin{height:31px;border-bottom:1px solid #b9a77a}
.cuad.d .lin{border-color:#d49ab0}
.check li{list-style:none;display:flex;gap:10px;align-items:center;font-size:14.3px;margin:3px 0}
.check li i{width:14px;height:14px;border:1.6px solid var(--c);border-radius:4px;display:inline-block}
.check li span{font-family:Mono;font-size:11px;color:#8a90a0;min-width:34px}
.pie{padding:0 0 22px;text-align:center;font-family:Mono;font-size:9.5px;letter-spacing:.06em;color:#9aa1b2;pointer-events:none}
@media (max-width:700px){.hoja{padding:26px 16px 60px}.bar{padding:10px 16px 0}.toc{columns:1}.g2,.g3,.qa{grid-template-columns:1fr}h1.tit{font-size:44px}.unidad>h2{font-size:36px}.sec{padding:16px 14px 12px}}
@media print{.bar{display:none}.pie{position:fixed;bottom:6px;left:0;right:0;padding:0}html,body{background-color:#fff}.hoja{max-width:none;padding:0 4mm}.sec{break-inside:auto}@page{size:A4;margin:14mm 12mm 16mm}}
</style></head><body>
<div class="bar"><button type="button" onclick="window.print()">Imprimir o guardar en PDF</button></div>
