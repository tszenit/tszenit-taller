  <div>
    <nav class="bot" aria-label="Navegación">
      <button class="nb" type="button" id="bPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="prog" aria-hidden="true"><span id="prog"></span></div>
      <button class="nb" type="button" id="bNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>

<div class="idx" id="idx" hidden role="dialog" aria-modal="true" aria-label="Índice">
  <div class="hd"><h2>Índice · I1 · Límites</h2><button class="tb" type="button" id="bIdxX">Cerrar</button></div>
  <div class="g" id="idxG"></div>
</div>
<script>
(function () {
  "use strict";
  var S = Array.prototype.slice.call(document.querySelectorAll(".s")), i = 0, KEY = "tsz-deck:" + document.title;
  var $ = function (id) { return document.getElementById(id); };
  var tit = function (s) { var h = s.getAttribute("data-t") || (s.querySelector("h1,h2") || {}).textContent || ""; return h.replace(/\s+/g, " ").trim(); };
  function go(n, back) {
    n = Math.max(0, Math.min(S.length - 1, n));
    S.forEach(function (s, k) { s.classList.toggle("on", k === n); s.classList.toggle("back", !!back && k !== n); s.setAttribute("aria-hidden", k === n ? "false" : "true"); });
    i = n; S[n].scrollTop = 0;
    $("cnt").textContent = (n + 1) + " / " + S.length;
    $("prog").style.width = (100 * (n + 1) / S.length) + "%";
    $("bPrev").disabled = n === 0; $("bNext").disabled = n === S.length - 1;
    try { localStorage.setItem(KEY, String(n)); } catch (e) {}
  }
  $("bPrev").addEventListener("click", function () { go(i - 1, true); });
  $("bNext").addEventListener("click", function () { go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (!$("idx").hidden) { if (e.key === "Escape") cerrarIdx(); return; }
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !(e.target && e.target.tagName === "BUTTON"))) { e.preventDefault(); go(i + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1, true); }
    else if (e.key === "Home") go(0, true); else if (e.key === "End") go(S.length - 1);
  });
  var x0 = null, y0 = 0;
  $("deck").addEventListener("touchstart", function (e) { var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
  $("deck").addEventListener("touchend", function (e) {
    if (x0 === null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.4 * Math.abs(dy)) dx < 0 ? go(i + 1) : go(i - 1, true);
  }, { passive: true });
  function abrirIdx() {
    $("idxG").innerHTML = S.map(function (s, k) { return '<button type="button" data-k="' + k + '"' + (k === i ? ' aria-current="true"' : "") + "><span>" + String(k + 1).padStart(2, "0") + "</span><b></b></button>"; }).join("");
    Array.prototype.forEach.call($("idxG").querySelectorAll("b"), function (b, k) { b.textContent = tit(S[k]); });
    $("idx").hidden = false; var c = $("idxG").querySelector('[aria-current="true"]'); c && c.focus();
  }
  function cerrarIdx() { $("idx").hidden = true; $("bIdx").focus(); }
  $("bIdx").addEventListener("click", abrirIdx); $("bIdxX").addEventListener("click", cerrarIdx);
  $("idxG").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; var k = +b.getAttribute("data-k"); $("idx").hidden = true; go(k, k < i); });
  var fsOk = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if (!fsOk) $("bFs").hidden = true;
  $("bFs").addEventListener("click", function () {
    var d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else { var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(function () { $("bFs").hidden = true; }); }
    } catch (e) { $("bFs").hidden = true; }
  });
  /* preguntas: data-a = índice correcto */
  Array.prototype.forEach.call(document.querySelectorAll(".q"), function (q) {
    var a = +q.getAttribute("data-a"), ops = q.querySelectorAll(".opt"), why = q.querySelector(".why");
    Array.prototype.forEach.call(ops, function (o, k) {
      o.addEventListener("click", function () {
        Array.prototype.forEach.call(ops, function (p, j) { p.disabled = true; if (j === a) p.classList.add("ok"); else if (j === k) p.classList.add("no"); });
        if (why) { why.hidden = false; var lb = why.querySelector(".k"); if (lb) lb.textContent = k === a ? "Correcto" : "La correcta es la " + "ABCD"[a]; }
      });
    });
  });
  var n0 = 0; try { n0 = parseInt(localStorage.getItem(KEY) || "0", 10) || 0; } catch (e) {}
  go(n0);
})();
</script>
